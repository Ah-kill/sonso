# Builds sonso-site/ and deploys each pull request to a preview channel, posting the link on the PR.
name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    paths: ['sonso-site/**']
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sonso-site
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: sonso-site
      - run: bundle exec jekyll build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SONSO_CO }}
          projectId: sonso-co
          entryPoint: sonso-site
