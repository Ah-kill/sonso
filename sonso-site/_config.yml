# SoNSo website — Jekyll settings.
# Edit the values below to connect bookings, the lead form and analytics.
# Leave a value empty ("") to switch that feature off safely.

title: "SoNSo"
url: "https://sonso.co.in"

# Contact details shown across the site
email: "hello@sonso.co.in"
phone_display: "+91 74161 74547"
phone_link: "+917416174547"
whatsapp: "917416174547"

# Google Calendar appointment schedule embed links, one per routing row in the Technical Spec.
# In Google Calendar: open the appointment schedule > Share > "Website embed" > "Inline booking page",
# and paste only the src="..." URL from the iframe code (it ends in ?gv=true). A plain booking-page
# link won't load inside the page. Empty = the Book page shows WhatsApp/email instead.
booking_build: ""
booking_automate: ""
booking_grow: ""
booking_measure: ""
booking_unsure: ""

# Apps Script web app URL (Deploy > New deployment > Web app). Empty = the form opens an email instead.
lead_form_endpoint: ""

# Analytics. Empty = the tag is not loaded.
ga4_id: ""
meta_pixel_id: ""
google_ads_id: ""

exclude:
  - README.md
  - apps-script
  - scripts
  - firebase.json
  - .firebaserc
  - .firebase
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
