# SoNSo website — Jekyll settings.
# Edit the values below to connect bookings, the lead form and analytics.
# Leave a value empty ("") to switch that feature off safely.

title: "SoNSo"
url: "https://sonso.co.in"

# Contact details shown across the site
email: "hello@sonso.co.in"
phone_display: "+91 93260 87180"
phone_link: "+919326087180"
whatsapp: "919326087180"

# Google Calendar appointment schedule links (Calendar > Appointment schedule > Share > Booking page link).
# One per routing row in the Technical Spec. Empty = the Book page shows email/WhatsApp instead.
booking_build: ""
booking_automate: ""
booking_grow: ""
booking_measure: ""
booking_unsure: ""

# Apps Script web app URL (Deploy > New deployment > Web app). Empty = the form opens an email instead.
lead_form_endpoint: ""

# Analytics. Empty = the tag is not loaded.
ga4_id: ""
meta_pixel_id: ""
google_ads_id: ""

exclude:
  - README.md
  - apps-script
  - scripts
  - firebase.json
  - .firebaserc
  - .firebase
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
