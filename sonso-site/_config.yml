# Apps Script web app URL (ends in /exec) from apps-script/Code.gs. Empty = the form offers WhatsApp/email to send instead.
# After changing the script, redeploy the SAME deployment (Manage deployments > Edit > New version) to keep this URL.
lead_form_endpoint: "https://script.google.com/macros/s/AKfycbx3Z_5GAJe-l58vCOsS_i3ZJAVx5Cycyog459-hAr8_yH5YmtSbzYJCs1YXTaqlgA2f/exec"

# Google Tag Manager container. Manage GA4, Google Ads and Meta Pixel tags inside GTM;
# The site pushes these dataLayer events (use them as GTM Custom Event triggers):
#   generate_lead          contact form sent (fires on /thank-you; or trigger on Page Path = /thank-you)
#   booking_calendar_open  visitor opened the Google booking calendar ("Choose a time")
#   booking_topic          visitor picked a topic on /book
#   contact_click          WhatsApp / email / phone link clicked (method = whatsapp|email|call)
#   book_call_click        any "Book a call" button clicked
gtm_id: "GTM-KM7J6WWQ"

# Direct analytics tags (optional, only if not managed through GTM). Empty = the tag is not loaded.
ga4_id: ""
meta_pixel_id: ""
google_ads_id: ""

exclude:
